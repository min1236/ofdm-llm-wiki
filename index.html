<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OFDM LLM Wiki</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#e9f2ff;background:#071321}body{margin:0}.wrap{max-width:1100px;margin:40px auto;padding:0 24px}.head{border-bottom:1px solid #29405b;padding-bottom:20px}h1{font-size:40px;margin:10px 0}p{line-height:1.9;color:#c7d5e7}.pill{color:#7ad2ff;letter-spacing:.14em;font-size:12px;text-transform:uppercase}.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;margin-top:28px}.nav,.article{background:#102239;border:1px solid #29405b;border-radius:18px;padding:23px}.nav button{display:block;border:0;color:#dceaff;background:transparent;border-radius:10px;width:100%;text-align:left;padding:13px;cursor:pointer;font-size:15px}.nav button.active,.nav button:hover{background:#183f63}.article{min-height:430px}a{color:#70cfff}h2{font-size:28px}h3{margin-top:27px}.hint{background:#123b48;border-left:4px solid #34c1b9;padding:14px 20px;border-radius:8px;line-height:1.7}.links button{background:#193b5b;color:#dceaff;border:1px solid #406181;border-radius:8px;padding:9px;cursor:pointer;margin:3px}@media(max-width:750px){.layout{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><div class="wrap"><div class="head"><div class="pill">Persistent · Linked · Source-backed</div><h1>OFDM LLM Wiki</h1><p>參考 Karpathy LLM Wiki 的可瀏覽知識庫。6 篇互連概念頁、5 份來源閱讀筆記。點擊左側條目瀏覽；此頁可離線開啟。</p><a href="../slides/index.html">前往 HTML 教學簡報 →</a></div><div class="layout"><nav class="nav"><h3>知識目錄</h3><div id="nav"></div></nav><article class="article" id="article"></article></div><p>來源內容整理日期：2026-11-22 · 來源全文請至原網站閱讀</p></div><script>
const pages=[{"slug": "introduction", "title": "什麼是 OFDM？", "body": "OFDM（Orthogonal Frequency-Division Multiplexing，正交分頻多工）是一種多載波數位調變技術：把原本高速的資料流分配到許多較低速的子載波同時傳送。與傳統將通道分成互不重疊頻帶的方式不同，OFDM 子載波頻譜可以重疊，但在設計的符號期間仍保持數學上的正交性。", "note": "入門類比：將高速公路的一條車道分成多條並行車道。注意這是類比，實際 OFDM 子載波頻譜是重疊的。", "sources": ["S01", "S02", "S03"], "links": ["orthogonality", "transceiver"]}, {"slug": "orthogonality", "title": "子載波為什麼能正交？", "body": "假設有效符號長度 T_u（不含 CP），以 Δf=1/T_u 作為子載波間隔。不同子載波的複指數訊號，在長度 T_u 的區間做內積結果為 0，因此在理想同步條件下，接收端可分離各子載波；「頻譜重疊」不等於「互相干擾」。", "note": "正交條件：Δf = 1/T_u。這裡的 T_u 是有效符號時間而不是含 CP 的總長。頻率偏移或時間同步誤差會破壞正交性並造成 ICI。", "sources": ["S01", "S03"], "links": ["introduction", "transceiver"]}, {"slug": "transceiver", "title": "OFDM 的傳送與接收流程", "body": "發送端：位元 → QPSK/QAM 映射 → 子載波排列 → IFFT → 加上 CP → 傳送。接收端：接收 → 同步 → 移除 CP → FFT → 等化 → 解映射。IFFT 把頻域的子載波資料合成時間域樣本；FFT 反過來還原各子載波頻域符號。", "note": "IFFT / FFT 為有效率的實作工具；不是把訊號「加密」。實務系統還包含通道估計、同步與編碼等步驟。", "sources": ["S01", "S02", "S03"], "links": ["orthogonality", "cyclic-prefix"]}, {"slug": "cyclic-prefix", "title": "循環字首 CP 是什麼？", "body": "CP（Cyclic Prefix）是將一個 OFDM 有效符號末尾的一小段樣本複製至符號最前面，形成保護區間。在通道延遲擴展不超過 CP 所能保護的範圍，且同步恰當時，可以降低前一符號造成的 ISI，並使頻域單抽頭等化較容易。", "note": "例：128 個有效樣本，加上 8 個 CP 樣本，傳送長度變為 136；CP 開銷 8/136 ≈ 5.88%。CP 不是新增有效資料，過長會減少頻譜效率。", "sources": ["S01", "S03", "S04"], "links": ["transceiver", "tradeoffs"]}, {"slug": "applications", "title": "OFDM 的實際應用", "body": "OFDM 廣泛運用於 Wi-Fi、LTE 與 5G NR 等系統。不過實際規格可能採不同的子載波配置與傳輸波形，例如 5G NR 上行還可採 DFT-s-OFDM。", "note": "不可把「5G 全部上下行都只有同一種 OFDM 波形」當成普遍結論；應依特定制式與方向判斷。", "sources": ["S01", "S05"], "links": ["introduction", "tradeoffs"]}, {"slug": "tradeoffs", "title": "OFDM 的優點與限制", "body": "優點包括適合處理頻率選擇性通道、可在各子載波進行相對簡單的等化、易於與多天線技術結合。限制包括需要精確的頻率/時間同步、較高的峰均功率比（PAPR）及 CP 帶來的額外開銷。", "note": "勿說 OFDM 能「完全消除多路徑干擾」；正確是透過 CP 與頻域等化降低其影響，仍需要滿足條件。", "sources": ["S01", "S03", "S04"], "links": ["cyclic-prefix", "applications"]}]; const sources={"S01": {"title": "OFDM Explained", "url": "https://www.mathworks.com/discovery/ofdm.html"}, "S02": {"title": "OFDM Modulation Using MATLAB", "url": "https://www.mathworks.com/help/comm/gs/ofdm-modulation-using-matlab.html"}, "S03": {"title": "ofdmmod — Modulate signals using OFDM method", "url": "https://www.mathworks.com/help/comm/ref/ofdmmod.html"}, "S04": {"title": "OFDM and Equalization with Prepended Cyclic Prefix", "url": "https://www.mathworks.com/help/comm/gs/ofdm-and-equalization-with-prepended-cyclic-prefix.html"}, "S05": {"title": "3GPP TS 38.201 (ETSI TS 138 201 V15.0.0)", "url": "https://www.etsi.org/deliver/etsi_ts/138200_138299/138201/15.00.00_60/ts_138201v150000p.pdf"}}; let current='introduction';function display(slug){current=slug;let p=pages.find(x=>x.slug===slug);document.getElementById('nav').innerHTML=pages.map(x=>`<button class="${x.slug===slug?'active':''}" onclick="display('${x.slug}')">${x.title}</button>`).join('');document.getElementById('article').innerHTML=`<div class="pill">Concept article · ${p.sources.join(' / ')}</div><h2>${p.title}</h2><h3>核心概念</h3><p>${p.body}</p><h3>教學提醒</h3><div class="hint">${p.note}</div><h3>來源引用</h3><ul>${p.sources.map(s=>`<li><a target="_blank" rel="noopener" href="${sources[s].url}">${s} · ${sources[s].title}</a></li>`).join('')}</ul><h3>延伸閱讀</h3><div class="links">${p.links.map(k=>`<button onclick="display('${k}')">${pages.find(x=>x.slug===k).title}</button>`).join('')}</div>`;history.replaceState(null,'','#'+slug)}display(pages.some(x=>x.slug===location.hash.slice(1))?location.hash.slice(1):'introduction');
</script></body></html>
