<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OFDM 初學者教學簡報</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#f1f7ff;background:#071220}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:22px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:#6cd9d5}.brand span{color:#8da3bb;margin-left:13px}.bar a{font-size:13px;color:#b7c8dc}.progress{height:5px;background:#203a54;border-radius:5px;margin:20px 0 10px}.progress>div{height:100%;width:9%;background:linear-gradient(90deg,#2bd0c3,#57aaff);border-radius:5px;transition:width .3s}.slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 35px;min-height:565px}.eyebrow{color:#62d0c9;font-size:15px;margin-bottom:16px}.slide h1{font-size:clamp(34px,5vw,62px);line-height:1.18;margin:0 0 20px;letter-spacing:-.04em}.subtitle{color:#bacbe0;font-size:clamp(19px,2.3vw,26px);margin:0 0 36px;line-height:1.5}.content{font-size:23px;color:#dbe6f5;line-height:1.7}.content p{max-width:930px}.hero-stat{font-size:clamp(22px,3.3vw,37px);font-weight:700;padding:30px;background:linear-gradient(120deg,#123c49,#152b4c);border-radius:18px}.hero-stat span{color:#5ae1d7}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.four>div,.two>div{background:#122940;border:1px solid #2d4e6f;border-radius:17px;padding:25px;color:#68cfcf}.four b{color:#f2f8ff;font-size:21px}.visual,.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.visual>div{background:#112a43;padding:28px;border-radius:18px}.single span,.multiple span{display:block;color:#6be2ce;margin:13px 0;font-size:20px}.equation{font-size:clamp(29px,4vw,50px);font-weight:700;color:#6fe2d7;padding:22px 28px;background:#122d46;border-radius:17px;display:inline-block}.pipeline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:19px 0}.pipeline span{background:#183c5a;padding:14px;border-radius:12px;font-size:19px}.pipeline b{color:#5bd2cb}.cp{display:flex;border-radius:13px;overflow:hidden;margin:20px 0;font-weight:700}.cp span{padding:30px 12px;text-align:center}.cp-pre{background:#18a999;color:#061d24;flex:1}.cp-body{background:#3179b2;flex:4}.tip{font-size:19px;color:#93d8d2;border-left:4px solid #43bdab;padding:10px 18px;background:#0d343b}.small{font-size:15px;color:#9cb2c9}ol{font-size:26px}li{margin-bottom:20px}#wave{width:100%;max-width:900px;height:auto;background:#0e263e;border-radius:16px}#quiz button{font-size:17px;padding:16px 20px;margin:8px;background:#143b59;border:1px solid #44839a;border-radius:10px;color:#fff;cursor:pointer}#quizResult{color:#72dec2;font-weight:700}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #29405b;padding:16px 0}.foot button{padding:12px 19px;border:1px solid #496881;border-radius:9px;background:#19364f;color:#fff;cursor:pointer;font-size:15px}.foot button:disabled{opacity:.3;cursor:not-allowed}.ref{color:#93aeca;font-size:13px;line-height:1.8}.ref a{color:#77d6e0}.help{color:#8da4b9;font-size:12px}.foot-right{display:flex;gap:9px;align-items:center}@media(max-width:700px){.shell{padding:12px}.slide{padding:22px 9px;min-height:610px}.four,.visual,.two{grid-template-columns:1fr 1fr}.four>div{padding:13px}.four b{font-size:15px}.content{font-size:18px}.pipeline span{font-size:13px}.foot{flex-wrap:wrap}.ref{width:100%}}</style></head><body><main class="shell"><header class="bar"><div class="brand">OFDM / LEARNING DECK <span>LLM Wiki → HTML</span></div><a href="../wiki/index.html">瀏覽 LLM Wiki ↗</a></header><div class="progress"><div id="progress"></div></div><section class="slide" id="slide" aria-live="polite"></section><footer class="foot"><div><div class="ref" id="ref"></div><div class="help">使用 ← → 鍵、空白鍵或下方按鈕切換</div></div><div class="foot-right"><button id="prev" onclick="move(-1)">← 上一頁</button><span id="counter" style="min-width:58px;text-align:center"></span><button id="next" onclick="move(1)">下一頁 →</button></div></footer></main><script>const slides=[{"title": "OFDM 是什麼？", "subtitle": "把高速資料分散到許多互相正交的子載波，一起傳送。", "body": "<div class=\"hero-stat\">一條高速資料流 <span>→</span> 多條平行低速子載波</div><p>用 10 分鐘理解 OFDM 的原理、收發流程與 5G 應用。</p>", "wiki": "introduction", "sources": ["S01"]}, {"title": "學習目標", "subtitle": "看完之後你應該能回答 4 個問題。", "body": "<div class=\"four\"><div>01<br><b>為何要分成子載波？</b></div><div>02<br><b>頻譜重疊為何不互相干擾？</b></div><div>03<br><b>IFFT/FFT 與 CP 做什麼？</b></div><div>04<br><b>OFDM 用在哪裡？</b></div></div>", "wiki": "introduction", "sources": ["S01", "S02"]}, {"title": "核心概念", "subtitle": "把資料分成多個平行的低速通道。", "body": "<div class=\"visual\"><div class=\"single\">單載波：<span>高速資料 ━━━━━━━━━━━━</span></div><div class=\"multiple\">OFDM：<span>子載波 1 ━━━━━</span><span>子載波 2 ━━━━━</span><span>子載波 3 ━━━━━</span><span>子載波 4 ━━━━━</span></div></div><p class=\"tip\">類比只幫助理解：真實 OFDM 的子載波頻譜可以重疊。</p>", "wiki": "introduction", "sources": ["S01"]}, {"title": "正交性", "subtitle": "頻譜能重疊，卻仍可以被分開。", "body": "<div class=\"equation\">Δf = 1 / T<sub>u</sub></div><p>T<sub>u</sub> 是「有效符號時間」（不包含循環字首 CP）。在這段時間中，不同子載波的內積為 0，因此理想同步下可以分離。</p><canvas id=\"wave\" width=\"900\" height=\"190\" aria-label=\"正交子載波頻譜示意\"></canvas><p class=\"small\">示意圖：相鄰子載波的峰值位置恰好落在另一子載波的零點。</p>", "wiki": "orthogonality", "sources": ["S03"]}, {"title": "發送與接收流程", "subtitle": "IFFT 合成訊號，FFT 再把子載波分開。", "body": "<div class=\"pipeline\"><span>資料位元</span><b>→</b><span>QPSK / QAM</span><b>→</b><span>IFFT</span><b>→</b><span>加入 CP</span><b>→</b><span>傳送</span></div><div class=\"pipeline\"><span>輸出資料</span><b>←</b><span>解映射</span><b>←</b><span>FFT / 等化</span><b>←</b><span>移除 CP</span><b>←</b><span>接收</span></div><p class=\"tip\">實際系統還需要同步與通道估計等處理。</p>", "wiki": "transceiver", "sources": ["S01", "S02"]}, {"title": "循環字首 CP", "subtitle": "把符號尾端的一小段複製到最前面。", "body": "<div class=\"cp\"><span class=\"cp-pre\">複製尾段 (CP)</span><span class=\"cp-body\">原始有效符號 (N 個樣本)</span></div><p>CP 提供保護區間；若長度足以涵蓋通道的延遲擴展並且同步適當，就有助於抑制符號間干擾（ISI）並簡化頻域等化。</p><p class=\"tip\">CP 不是加入 0，也不能保證完全消除所有干擾。</p>", "wiki": "cyclic-prefix", "sources": ["S03", "S04"]}, {"title": "CP 的代價", "subtitle": "保護越長，傳輸開銷也越大。", "body": "<div class=\"equation\">CP 比例 = N<sub>CP</sub> / (N + N<sub>CP</sub>)</div><p>若有效符號有 128 個樣本，CP 有 8 個樣本，則 CP 比例 = 8 / 136 ≈ <strong>5.88%</strong>。</p><p>這 8 個樣本本身不承載新的獨立資訊。</p>", "wiki": "cyclic-prefix", "sources": ["S04"]}, {"title": "實際應用", "subtitle": "Wi-Fi、LTE 與 5G NR 都與 OFDM 有關。", "body": "<div class=\"four\"><div>📶<br><b>Wi-Fi</b></div><div>📱<br><b>LTE</b></div><div>🌐<br><b>5G NR</b></div><div>📡<br><b>MIMO 整合</b></div></div><p class=\"tip\">細節依標準不同；5G NR 上行也可使用 DFT-s-OFDM。</p>", "wiki": "applications", "sources": ["S01", "S05"]}, {"title": "優點與限制", "subtitle": "不是「完全沒有干擾」，而是更容易處理多路徑。", "body": "<div class=\"two\"><div><h3>優點</h3><p>✓ 多路徑下的等化較簡單<br>✓ 頻率資源配置彈性<br>✓ 可結合 MIMO</p></div><div><h3>限制</h3><p>! 頻率同步要求高<br>! 峰均功率比（PAPR）偏高<br>! CP 帶來開銷</p></div></div>", "wiki": "tradeoffs", "sources": ["S01", "S03", "S04"]}, {"title": "快速測驗", "subtitle": "確認你真的理解 OFDM。", "body": "<div id=\"quiz\"><p>問：子載波間隔 Δf=1/T<sub>u</sub> 中的 T<sub>u</sub> 指的是什麼？</p><button onclick=\"answer(false)\">含 CP 的完整符號時間</button><button onclick=\"answer(true)\">不含 CP 的有效符號時間</button><p id=\"quizResult\" aria-live=\"polite\"></p></div>", "wiki": "orthogonality", "sources": ["S03"]}, {"title": "重點回顧與來源", "subtitle": "記住 3 句話，就抓住 OFDM 核心。", "body": "<ol><li>OFDM 將資料放進多個正交子載波。</li><li>用 IFFT / FFT 完成時間域與頻域的轉換。</li><li>CP 有助於多路徑等化，但需要符合條件且有開銷。</li></ol><p class=\"small\">資料依據：S01～S05，請見頁尾「知識庫對應與來源」。</p>", "wiki": "introduction", "sources": ["S01", "S02", "S03"]}];const urls={"S01": "https://www.mathworks.com/discovery/ofdm.html", "S02": "https://www.mathworks.com/help/comm/gs/ofdm-modulation-using-matlab.html", "S03": "https://www.mathworks.com/help/comm/ref/ofdmmod.html", "S04": "https://www.mathworks.com/help/comm/gs/ofdm-and-equalization-with-prepended-cyclic-prefix.html", "S05": "https://www.etsi.org/deliver/etsi_ts/138200_138299/138201/15.00.00_60/ts_138201v150000p.pdf"};let at=0;function render(){let s=slides[at];document.getElementById('slide').innerHTML=`<div class="eyebrow">OFDM 基礎教學 · 第 ${at+1} 單元</div><h1>${s.title}</h1><p class="subtitle">${s.subtitle}</p><div class="content">${s.body}</div>`;document.getElementById('ref').innerHTML=`Wiki：<a href="../wiki/index.html#${s.wiki}">${s.wiki}</a> · 來源：`+s.sources.map(id=>`<a href="${urls[id]}" target="_blank" rel="noopener">${id}</a>`).join('、');document.getElementById('counter').textContent=`${at+1} / ${slides.length}`;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===slides.length-1;document.getElementById('progress').style.width=(100*(at+1)/slides.length)+'%';history.replaceState(null,'','#'+(at+1));if(at===3)drawWave()}function move(n){at=Math.max(0,Math.min(slides.length-1,at+n));render()}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}});function answer(correct){document.getElementById('quizResult').textContent=correct?'答對了！Tᵤ 是有效符號期間，不含 CP。':'再想想：CP 是額外加上的保護區間，所以不計入 Tᵤ。'}function drawWave(){let c=document.getElementById('wave');if(!c)return;let ctx=c.getContext('2d');const w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#35526e';ctx.beginPath();ctx.moveTo(25,h-30);ctx.lineTo(w-15,h-30);ctx.stroke();let colors=['#43d7c9','#ffcc6d','#80a9ff'];for(let k=0;k<3;k++){ctx.beginPath();ctx.lineWidth=3;ctx.strokeStyle=colors[k];for(let i=0;i<840;i++){let x=(i-420)/95-k*1.9;let y=Math.abs(x)<1e-5?1:Math.sin(Math.PI*x)/(Math.PI*x);let yy=h-30-y*y*124;let xx=i+30;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke()}ctx.font='15px system-ui';ctx.fillStyle='#bed4e8';ctx.fillText('頻率 → （sinc² 包絡線示意）',30,25)}let h=parseInt(location.hash.slice(1));if(Number.isInteger(h)&&h>=1&&h<=slides.length)at=h-1;render();</script></body></html>
